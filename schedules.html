<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NASCAR Schedule</title>
<style>
  body { background-color: #111; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
  h2 { color: #facc15; text-align: center; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
  
  .nav-bar { display: flex; justify-content: center; margin-bottom: 20px; gap: 15px; }
  .nav-link { color: #facc15; text-decoration: none; font-weight: bold; padding: 8px 16px; border: 2px solid transparent; border-radius: 6px; transition: all 0.2s; }
  .nav-link:hover, .nav-link.active { background-color: #facc15; color: #111; border-color: #facc15; }
  
  table { width: 100%; max-width: 1000px; margin: 0 auto 30px auto; border-collapse: collapse; font-size: 0.95rem; background-color: #1f2937; border-radius: 8px; overflow: hidden; }
  th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #374151; }
  th { background-color: #111827; color: #facc15; text-transform: uppercase; font-size: 0.85rem; border-bottom: 2px solid #facc15; }
  tr:hover { background-color: #374151; }
  .next-race-row { background-color: #374151; font-weight: bold; border-left: 4px solid #4ade80; }
</style>
</head>
<body>

  <h2>📅 2026 Season Schedule</h2>
  <nav class="nav-bar">
    <a href="index.html" class="nav-link">Live Ticker</a>
    <a href="schedules.html" class="nav-link active">Schedule</a>
    <a href="live-points.html" class="nav-link">Live Points</a>
  </nav>

  <table id="schedule-table">
    <thead>
      <tr>
        <th>Series</th>
        <th>Race Name</th>
        <th>Track</th>
        <th>Date / Time</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="4">Loading schedule data...</td></tr>
    </tbody>
  </table>

<script>
const raceListUrl = "https://api.allorigins.win/raw?url=https://cf.nascar.com/cacher/2026/race_list_basic.json";

async function loadSchedule() {
  try {
    const res = await fetch(raceListUrl);
    const raceList = await res.json();
    const seriesMap = { series_1: "Cup Series", series_2: "Xfinity Series", series_3: "Truck Series" };
    const tbody = document.querySelector("#schedule-table tbody");
    tbody.innerHTML = "";

    const now = new Date();

    Object.entries(seriesMap).forEach(([key, name]) => {
      // Get upcoming races for this series
      const upcoming = (raceList[key] || [])
        .map(r => ({ ...r, dateObj: new Date(r.race_date) }))
        .filter(r => r.dateObj > now)
        .sort((a,b) => a.dateObj - b.dateObj);

      if (upcoming.length > 0) {
        const next = upcoming[0];
        const dateStr = next.dateObj.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        
        const row = document.createElement("tr");
        row.className = "next-race-row";
        row.innerHTML = `
          <td style="color: #60a5fa;">${name}</td>
          <td>${next.race_name}</td>
          <td>${next.track_name}</td>
          <td>${dateStr}</td>
        `;
        tbody.appendChild(row);
      }
    });
  } catch (err) {
    console.error(err);
    document.querySelector("#schedule-table tbody").innerHTML = `<tr><td colspan="4" style="color: #f87171;">Failed to load schedule.</td></tr>`;
  }
}

loadSchedule();
</script>
</body>
</html>
