<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASCAR Live Race Feed</title>
  <style>
    body { background-color: #111; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
    h2 { color: #facc15; text-align: center; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Nav Bar */
    .nav-bar { display: flex; justify-content: center; margin-bottom: 20px; gap: 15px; }
    .nav-link { color: #facc15; text-decoration: none; font-weight: bold; padding: 8px 16px; border: 2px solid transparent; border-radius: 6px; transition: all 0.2s ease-in-out; }
    .nav-link:hover, .nav-link.active { background-color: #facc15; color: #111; border-color: #facc15; }
    
    /* Race Status Banner */
    #status-banner { background-color: #1f2937; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; border: 1px solid #374151; }
    #updated { display: block; font-size: 0.8rem; color: #9ca3af; margin-top: 5px; font-weight: normal; }

    /* Tables */
    table { width: 100%; max-width: 1200px; margin: 0 auto; border-collapse: collapse; font-size: 0.95rem; background-color: #1f2937; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #374151; }
    th { background-color: #111827; color: #facc15; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; border-bottom: 2px solid #facc15; }
    tr:hover { background-color: #374151; }
    
    /* Status Colors */
    .status-running { color: #4ade80; font-weight: bold; }
    .status-off { color: #fbbf24; font-weight: bold; }
    .status-out { color: #f87171; font-weight: bold; }
    .fastest { color: #c084fc; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🏁 Live Race Feed</h2>
  <nav class="nav-bar">
    <a class='nav-link active' href='/'>Live Ticker</a>
    <a class='nav-link' href='/schedules'>Schedule</a>
    <a class='nav-link' href='/live-points'>Live Points</a>
  </nav>

  <div id="status-banner">
    <span id="flag-status">Loading race status...</span>
    <span id="updated">Waiting for telemetry...</span>
  </div>

  <table id="race-table">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Car #</th>
        <th>Driver</th>
        <th>Interval</th>
        <th>Status</th>
        <th>Laps Led</th>
        <th>Fastest Lap</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
async function fetchData() {
  try {
    const feedUrl = "https://api.allorigins.win/raw?url=https://cf.nascar.com/live/feeds/live-feed.json";
    const res = await fetch(feedUrl);
    if (!res.ok) throw new Error("Network response was not ok");
    const feed = await res.json();

    updateStatus(feed);
    updateRaceTable(feed);

    document.getElementById("updated").textContent = "Last updated: " + new Date().toLocaleTimeString();
  } catch (err) {
    console.error("Telemetry error:", err);
    document.getElementById("updated").textContent = "Connection to telemetry lost. Retrying...";
  }
}

function updateStatus(feed) {
  const completed = feed.lap_number || 0;
  const total = feed.laps_in_race || 0;

  const flagMap = {
    1: "Green Flag 🟢",
    2: "Yellow Flag 🟡",
    3: "Red Flag 🔴",
    4: "White Flag ⚪",
    5: "Checkered Flag 🏁",
    8: "Hot Track 🔥",
    9: "Cold Track ❄️"
  };

  let flagText = flagMap[feed.flag_state] || "Waiting for Green 🏳️";
  
  // Force Checkered if laps are complete
  if (completed > 0 && completed === total) {
    flagText = "Checkered Flag 🏁";
  }

  document.getElementById("flag-status").innerHTML = `${flagText} &nbsp;|&nbsp; Laps: ${completed} / ${total}`;
}

function updateRaceTable(feed) {
  const tbody = document.querySelector("#race-table tbody");
  tbody.innerHTML = "";
  if (!feed.vehicles) return;

  const fastestLapTime = Math.min(...feed.vehicles.map(v => v.best_lap_time).filter(t => t > 0));

  feed.vehicles.sort((a,b) => a.running_position - b.running_position).forEach(v => {
      const row = document.createElement("tr");
      const driver = v.driver?.full_name || "Unknown";
      
      // Calculate Laps Led with Pole Sitter offset
      let lapsLedVal = v.laps_led?.length ? v.laps_led.reduce((sum, l) => sum + (l.end_lap - l.start_lap - 1), 0) : 0;
      if (v.starting_position === 1 && lapsLedVal > 0) lapsLedVal -= 0;
      const lapsLed = lapsLedVal > 0 ? lapsLedVal : "-";
      
      const hasFastest = v.best_lap_time === fastestLapTime && v.best_lap_time > 0;

      // Status Logic & Styling
      let statusText = "Out";
      let statusClass = "status-out";
      
      if (v.status === 1) {
        if (v.is_off_track) {
          statusText = "Off";
          statusClass = "status-off";
        } else {
          statusText = "Running";
          statusClass = "status-running";
        }
      }

      row.innerHTML = `
        <td><strong>${v.running_position ?? "-"}</strong></td>
        <td>${v.vehicle_number ?? "-"}</td>
        <td style="text-align: left; font-weight: bold;">${driver}</td>
        <td>${v.delta > 0 ? '+' + v.delta.toFixed(3) : (v.delta === 0 ? "Leader" : "-")}</td>
        <td class="${statusClass}">${statusText}</td>
        <td>${lapsLed}</td>
        <td class="${hasFastest ? 'fastest' : ''}">${v.best_lap_time ? v.best_lap_time.toFixed(3) : "-"} ${hasFastest ? '🚀' : ''}</td>
      `;
      tbody.appendChild(row);
    });
}

fetchData();
setInterval(fetchData, 10000); // 10 second refresh
</script>
</body>
</html>
