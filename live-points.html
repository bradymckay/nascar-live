<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Series Live Points</title>
  <style>
    body { background-color: #111; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
    h2 { color: #facc15; text-align: center; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    
    .nav-bar { display: flex; justify-content: center; margin-bottom: 20px; gap: 15px; }
    .nav-link { color: #facc15; text-decoration: none; font-weight: bold; padding: 8px 16px; border: 2px solid transparent; border-radius: 6px; transition: all 0.2s; }
    .nav-link:hover, .nav-link.active { background-color: #facc15; color: #111; border-color: #facc15; }
    
    .controls { text-align: center; margin-bottom: 20px; background-color: #1f2937; padding: 15px; border-radius: 8px; border: 1px solid #374151; max-width: 900px; margin-left: auto; margin-right: auto; }
    select { padding: 10px; background: #111827; color: #facc15; border: 1px solid #374151; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; outline: none; }
    
    table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; font-size: 0.95rem; background-color: #1f2937; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #374151; }
    th { background-color: #111827; color: #facc15; text-transform: uppercase; font-size: 0.85rem; border-bottom: 2px solid #facc15; }
    tr:hover { background-color: #374151; }
    
    #loading-msg { text-align: center; color: #9ca3af; font-style: italic; }
  </style>
</head>
<body>

  <h2>🏆 Live Points Standings</h2>
  
  <nav class="nav-bar">
    <a href="index.html" class="nav-link">Live Ticker</a>
    <a href="schedules.html" class="nav-link">Schedule</a>
    <a href="live-points.html" class="nav-link active">Live Points</a>
  </nav>

  <div class="controls">
    <label for="race-selector" style="margin-right: 10px; font-weight: bold;">Select Race Event:</label>
    <select id="race-selector">
      <option value="">Loading 2026 Season...</option>
    </select>
  </div>

  <div id="points-container">
    <div id="loading-msg">Select a race to view points...</div>
  </div>

<script>
  const raceListUrl = "https://api.allorigins.win/raw?url=https://cf.nascar.com/cacher/2026/race_list_basic.json";
  const selector = document.getElementById("race-selector");
  const container = document.getElementById("points-container");

  async function init() {
    try {
      const res = await fetch(raceListUrl);
      const data = await res.json();
      
      // Filter for Cup Series (series_1) and reverse to show most recent first
      const cupRaces = data.series_1.reverse(); 

      selector.innerHTML = cupRaces.map(r => 
        `<option value="${r.race_id}">${r.race_name} - ${r.track_name}</option>`
      ).join('');
      
      // Auto-load the most recent/current race
      if(selector.value) loadLivePoints(selector.value);
      
    } catch (err) {
      console.error(err);
      selector.innerHTML = `<option>Error loading schedule</option>`;
    }
  }

  async function loadLivePoints(raceId) {
    container.innerHTML = `<div id="loading-msg">Fetching points data for Race ID ${raceId}...</div>`;
    try {
      const url = `https://api.allorigins.win/raw?url=https://cf.nascar.com/live/feeds/series_1/${raceId}/live_points.json`;
      const res = await fetch(url);
      const data = await res.json();
      const drivers = data.vehicles || data;

      if (!drivers || drivers.length === 0) {
        container.innerHTML = `<div id="loading-msg">No points data available for this event yet.</div>`;
        return;
      }

      let html = `<table>
        <tr>
          <th>Rank</th>
          <th>Driver</th>
          <th>Total Points</th>
          <th>Points Earned</th>
          <th>Wins</th>
          <th>Top 5</th>
          <th>Top 10</th>
        </tr>`;

      drivers.sort((a,b) => a.points_position - b.points_position).forEach(d => {
        html += `<tr>
          <td><strong>${d.points_position ?? '-'}</strong></td>
          <td style="text-align: left;">${d.first_name} ${d.last_name}</td>
          <td style="font-weight: bold; color: #4ade80;">${d.points ?? 0}</td>
          <td>${d.points_earned_this_race ?? 0}</td>
          <td>${d.wins ?? 0}</td>
          <td>${d.top_5 ?? 0}</td>
          <td>${d.top_10 ?? 0}</td>
        </tr>`;
      });
      
      html += "</table>";
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = `<div id="loading-msg" style="color:#f87171;">⚠️ Could not load points. The race may not have started.</div>`;
    }
  }

  selector.addEventListener('change', (e) => loadLivePoints(e.target.value));
  init();
</script>
</body>
</html>
